<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | ClubSphere</title><link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar"><div class="nav-inner"><a class="logo" href="/">ClubSphere</a><div class="nav-links"><a href="/events.html">Events</a></div></div></nav>
<main class="container">
  <div class="form-card">
    <h2 id="eventTitle">Event Registration</h2>
    <p id="eventInfo" style="color:#6f7182;margin:5px 0 22px"></p>
    <div id="success" class="success"></div><div id="error" class="error"></div>
    <form id="registrationForm">
      <div class="form-group"><label>Name</label><input class="input" name="name" required></div>
      <div class="form-group"><label>Email</label><input class="input" type="email" name="email" required></div>
      <div class="form-group"><label>College / Year</label><input class="input" name="collegeYear" placeholder="e.g. ABES / 2nd Year" required></div>
      <div class="form-group"><label>Phone Number</label><input class="input" name="phone" pattern="[0-9]{10}" placeholder="10 digit phone number" required></div>
      <button class="btn btn-primary" type="submit">Submit Registration</button>
    </form>
  </div>
</main>
<script src="/js/register.js"></script>
</body>
</html>
