<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff"/><stop offset=".5" stop-color="#eef2ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
  <linearGradient id="pinkPurple"><stop stop-color="#ff4fa3"/><stop offset=".5" stop-color="#b56cff"/><stop offset="1" stop-color="#55d9ff"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="round"><rect width="1280" height="740" rx="32"/></clipPath>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
    .ui{font-family:Arial,sans-serif}
    .title{font-family:cursive;font-size:72px;font-weight:700;fill:url(#pinkPurple)}
    .fade{animation:fade 1s both}
    .pop{animation:pop .7s both}
    @keyframes fade{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
    @keyframes pop{0%{opacity:0;transform:scale(.7)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
    @keyframes blink{50%{opacity:0}}
    @keyframes scan{0%{transform:translateY(-760px)}100%{transform:translateY(760px)}}
    @keyframes flicker{0%,18%,20%,22%,65%,100%{opacity:1}19%,21%,64%{opacity:.25}}
    @keyframes float{50%{transform:translateY(-12px)}}
    @keyframes type{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
  </style>
</defs>
<g clip-path="url(#round)">
<rect width="1280" height="740" fill="url(#bg)"/>
<circle cx="1040" cy="160" r="150" fill="#7b2cff" opacity=".12" filter="url(#glow)"/>
<circle cx="230" cy="570" r="190" fill="#ff2d9b" opacity=".09" filter="url(#glow)"/>
