<text x="1135" y="639" class="mono" fill="#9cecff" font-size="14">ON FIRE</text></g>

<g class="ui" filter="url(#glow)" animation="flicker 4s infinite"><text x="910" y="710" text-anchor="middle" fill="#ff69c7" font-size="20">KEEP CODING KEEP GROWING</text></g>
<g fill="#ff63c7" opacity=".7" animation="float 3s ease-in-out infinite"><text x="35" y="180" font-size="25">♥</text><text x="1180" y="180" font-size="22">♥</text><text x="560" y="700" font-size="20">♥</text></g>
<g fill="#fff" opacity=".8"><circle cx="40" cy="90" r="2"/><circle cx="555" cy="110" r="3"/><circle cx="1230" cy="330" r="2"/><circle cx="570" cy="580" r="2"/></g>
<rect x="0" y="0" width="1280" height="4" fill="#8fffff" filter="url(#glow)" animation="scan 3.5s linear infinite"/>
</g></svg>