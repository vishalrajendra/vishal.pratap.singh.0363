<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | ClubSphere</title><link rel="stylesheet" href="/css/admin.css">
</head>
<body>
<div class="admin-layout">
<aside class="sidebar"><h2>ClubSphere</h2><nav>
<a class="active" href="/admin">Dashboard</a><a href="#" onclick="openEventModal()">+ Add Event</a><a href="#registrations">Registrations</a><a href="/">← Student Site</a>
</nav></aside>
<main class="main">
<div class="topbar"><div><h1>Admin Dashboard</h1><p style="color:#77798a">Manage events and student registrations.</p></div><button class="btn btn-primary" onclick="openEventModal()">+ Add Event</button></div>
<section class="stats"><div class="stat"><small>Total Events</small><strong id="eventCount">0</strong></div><div class="stat"><small>Registrations</small><strong id="registrationCount">0</strong></div><div class="stat"><small>Featured Events</small><strong id="featuredCount">0</strong></div></section>

<section class="panel"><div class="panel-head"><h2>Events</h2></div>
<div class="search-row"><input id="eventSearch" class="input" placeholder="Search events..."><select id="eventCategory"><option>All</option><option>Technical</option><option>Cultural</option><option>Sports</option><option>Workshop</option><option>Competition</option><option>Seminar</option><option>Other</option></select></div>
<div class="table-wrap"><table><thead><tr><th>Event</th><th>Category</th><th>Date</th><th>Venue</th><th>Actions</th></tr></thead><tbody id="eventsTable"></tbody></table></div></section>

<section id="registrations" class="panel"><div class="panel-head"><h2>Registered Students</h2></div>
<div class="search-row"><input id="regSearch" class="input" placeholder="Search name, email, college/year..."><select id="regEvent"><option value="">All Events</option></select></div>
<div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>College / Year</th><th>Phone</th><th>Event</th></tr></thead><tbody id="registrationsTable"></tbody></table></div></section>
</main></div>

<div id="eventModal" class="modal"><div class="modal-card">
<div class="modal-head"><h2 id="modalTitle">Add Event</h2><button class="close" onclick="closeEventModal()">×</button></div>
<div id="message" class="message"></div>
<form id="eventForm"><input type="hidden" id="eventId">
<div class="form-grid">
<div class="form-group"><label>Event Name</label><input id="name" class="input" required></div>
<div class="form-group"><label>Category</label><select id="category" class="input" required><option>Technical</option><option>Cultural</option><option>Sports</option><option>Workshop</option><option>Competition</option><option>Seminar</option><option>Other</option></select></div>
<div class="form-group"><label>Date</label><input id="date" type="date" class="input" required></div>
<div class="form-group"><label>Time</label><input id="time" type="time" class="input" required></div>
<div class="form-group full"><label>Venue</label><input id="venue" class="input" required></div>
<div class="form-group full"><label>Description</label><textarea id="description" rows="4" required></textarea></div>
<div class="form-group"><label>Image URL (optional)</label><input id="image" class="input"></div>
<div class="form-group"><label><input id="featured" type="checkbox"> Featured event</label></div>
</div><button class="btn btn-primary" type="submit">Save Event</button></form>
</div></div>
<script src="/js/admin.js"></script>
</body>
</html>
